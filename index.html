<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Kod Sistem MSIC</title>
    
    <!-- Trik Memintas Laluan Assets yang Tegar -->
    <script>
      // 1. Set baseUrl rasmi untuk Expo Router
      window.__expo = window.__expo || {};
      window.__expo.baseUrl = '/msic-web';

      // 2. Trik memintas Service Worker / Fetch jika aplikasi cuba cari di root utama
      const originalFetch = window.fetch;
      window.fetch = function(...args) {
        if (typeof args[0] === 'string' && args[0].startsWith('/assets/')) {
          args[0] = '/msic-web' + args[0];
        }
        return originalFetch.apply(this, args);
      };
    </script>

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Ubah suai favicon supaya cari dalam repo msic-web -->
    <link rel="icon" href="./favicon.ico" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    
    <div id="root"></div>
    
    <!-- Jalankan fail JavaScript utama -->

  </body>
</html>
