<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- 1. KUNCI VIEWPORT: Menghalang auto-zoom & picit jari (pinch-to-zoom) pada Phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Kod Sistem MSIC</title>
    
    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* 2. RESPONSIVE FIX: Menggunakan Dynamic Viewport Height (dvh) untuk elak isu keyboard bertindih */
      html,
      body {
        height: 100vh !important;
        height: 100dvh !important; /* !important memaksa browser ikut saiz keyboard iPhone */
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Menghalang skrin utama daripada digoyang terkeluar bucu */
        -webkit-text-size-adjust: 100%; /* Menghalang iPhone daripada auto-besarkan teks */
      }
      #root {
        display: flex;
        height: 100vh !important;
        height: 100dvh !important;
        width: 100%;
      }

      /* 3. FIX BOX BIRU: Buang semua border biru menyala semasa kotak input ditekan */
      input, select, textarea, button, [component="TextInput"] {
        outline: none !important;
        box-shadow: none !important;
      }
    </style>
    
    <link rel="icon" href="./favicon.ico" />
    
    <!-- FIX MUTLAK SAFARI: Guna jalan relatif lokal + pancingan cache ?v=1 -->
    <link rel="apple-touch-icon" href="./assets/logo.2a8899cba02a3e3a00d566457322ffcf.png?v=1" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    
    <div id="root"></div>
    
    <script src="./_expo/static/js/web/index-eb102d7eff63d8361917b2b4ba1e0d13.js?v=4" defer></script>

    <!-- 4. SCRIPT PENJINAK: Paksa susunan kategori ikut kehendak client tanpa ubah kod asal -->
    <script>
      (function() {
        // Urutan tepat yang diminta oleh client
        const urutanSaranan = ["Pertanian", "Pembuatan", "Pembinaan", "Perkhidmatan", "Industri Lain"];

        function susunKategori() {
          // Cari semua elemen teks dalam skrin
          const semuaElemen = document.querySelectorAll('div, span, p, a');
          let senaraiButang = {};
          let kontenaInduk = null;

          // Padankan elemen berdasarkan teks kategori
          semuaElemen.forEach(el => {
            if (el.children.length === 0 && el.textContent) {
              const teks = el.textContent.trim();
              if (urutanSaranan.includes(teks)) {
                // Naik ke atas cari wrapper butang utama (React Native Web biasanya pakai div biasa)
                let butang = el;
                while (butang && butang.parentElement && !butang.getAttribute('data-testid') && butang.parentElement.id !== 'root') {
                  // Berhenti jika kontena itu ada susunan flex-row (kontena menu)
                  const style = window.getComputedStyle(butang.parentElement);
                  if (style.flexDirection === 'row' || butang.parentElement.children.length >= 3) {
                    break;
                  }
                  butang = butang.parentElement;
                }
                
                if (butang && butang.parentElement) {
                  kontenaInduk = butang.parentElement;
                  senaraiButang[teks] = butang;
                }
              }
            }
          });

          // Jika kontena induk dijumpai, susun semula susunan DOM mengikut urutan array
          if (kontenaInduk && Object.keys(senaraiButang).length >= 2) {
            urutanSaranan.forEach(nama => {
              if (senaraiButang[nama]) {
                kontenaInduk.appendChild(senaraiButang[nama]);
              }
            });
          }
        }

        // Semak dan paksa susunan setiap 300ms (Sebab React kerap render semula elemen)
        const runInterval = setInterval(susunKategori, 300);
        
        // Hentikan fungsi semakan selepas 6 saat untuk jimatkan pemprosesan fon
        setTimeout(() => clearInterval(runInterval), 6000);
      })();
    </script>
  </body>
</html>
