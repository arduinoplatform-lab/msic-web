<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Kod Sistem MSIC</title>
    
    <style id="expo-reset">
      /* RESPONSIVE FIX */
      html, body {
        height: 100vh !important;
        height: 100dvh !important;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100vh !important;
        height: 100dvh !important;
        width: 100%;
      }
      /* FIX BOX BIRU */
      input, select, textarea, button, [component="TextInput"] {
        outline: none !important;
        box-shadow: none !important;
      }

      /* ================================================================= */
      /* TAKTIK NUKLEAR CSS ORDER: SUSUN IKUT KEDUDUKAN ASAL (INDEX POSITION) */
      /* ================================================================= */
      
      /* Cari kontena menu kategori popular (elemen yang ada 5 anak butang di dalam) */
      div[style*="flex-direction"][style*="row"] > div, 
      div[style*="flexDirection"][style*="row"] > div {
        /* Paksa kontena induk mereka kekal aktifkan kuasa Flexbox */
        display: flex !important;
      }

      /* Susunan Asal: 
         1: Perkhidmatan -> Kita nak dia pergi No 4
         2: Pembuatan   -> Kita nak dia kekal No 2
         3: Pembinaan   -> Kita nak dia kekal No 3
         4: Pertanian   -> Kita nak dia pergi No 1 (DEPAN SEKALI)
         5: Industri Lain -> Kita nak dia kekal No 5
      */

      /* Butang Asal No 1 (Perkhidmatan) -> Campak ke No 4 */
      div[style*="flex-direction"][style*="row"] > div:nth-child(1),
      div[style*="flexDirection"][style*="row"] > div:nth-child(1) {
        order: 4 !important;
      }

      /* Butang Asal No 2 (Pembuatan) -> Kekal No 2 */
      div[style*="flex-direction"][style*="row"] > div:nth-child(2),
      div[style*="flexDirection"][style*="row"] > div:nth-child(2) {
        order: 2 !important;
      }

      /* Butang Asal No 3 (Pembinaan) -> Kekal No 3 */
      div[style*="flex-direction"][style*="row"] > div:nth-child(3),
      div[style*="flexDirection"][style*="row"] > div:nth-child(3) {
        order: 3 !important;
      }

      /* Butang Asal No 4 (Pertanian) -> SUNTIK PERGI NO 1 (DEPAN SEKALI!) */
      div[style*="flex-direction"][style*="row"] > div:nth-child(4),
      div[style*="flexDirection"][style*="row"] > div:nth-child(4) {
        order: 1 !important;
      }

      /* Butang Asal No 5 (Industri Lain) -> Kekal No 5 */
      div[style*="flex-direction"][style*="row"] > div:nth-child(5),
      div[style*="flexDirection"][style*="row"] > div:nth-child(5) {
        order: 5 !important;
      }
      /* ================================================================= */
    </style>

  </head>
