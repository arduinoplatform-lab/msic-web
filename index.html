<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Kod Sistem MSIC</title>
    
    <style id="expo-reset">
      /* RESPONSIVE FIX */
      html,
      body {
        height: 100vh !important;
        height: 100dvh !important;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100vh !important;
        height: 100dvh !important;
        width: 100%;
      }

      /* FIX BOX BIRU */
      input, select, textarea, button, [component="TextInput"] {
        outline: none !important;
        box-shadow: none !important;
      }

      /* ================================================================= */
      /* KUASA CSS MUTLAK: PAKSA SUSUNAN KATEGORI TANPA JAVASCRIPT */
      /* ================================================================= */
      
      /* 1. Cari elemen kontena yang memegang semua butang kategori popular dan aktifkan Flexbox */
      div[style*="flex-direction"][style*="row"], 
      div[style*="flexDirection"][style*="row"] {
        display: flex !important;
      }

      /* 2. Kesan teks di dalam butang, cari bapa butang tersebut, dan paksa susunan (Flex Order) */
      div:has(> div:contains("Pertanian")), 
      div:has(> span:contains("Pertanian")),
      div:has(> *:contains("Pertanian")) { 
        order: 1 !important; 
      }

      div:has(> div:contains("Pembuatan")), 
      div:has(> span:contains("Pembuatan")),
      div:has(> *:contains("Pembuatan")) { 
        order: 2 !important; 
      }

      div:has(> div:contains("Pembinaan")), 
      div:has(> span:contains("Pembinaan")),
      div:has(> *:contains("Pembinaan")) { 
        order: 3 !important; 
      }

      div:has(> div:contains("Perkhidmatan")), 
      div:has(> span:contains("Perkhidmatan")),
      div:has(> *:contains("Perkhidmatan")) { 
        order: 4 !important; 
      }

      div:has(> div:contains("Industri Lain")), 
      div:has(> span:contains("Industri Lain")),
      div:has(> *:contains("Industri Lain")) { 
        order: 5 !important; 
      }
      /* ================================================================= */
    </style>
