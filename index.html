<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- 1. KUNCI VIEWPORT: Menghalang auto-zoom & picit jari (pinch-to-zoom) pada Phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>Kod Sistem MSIC</title>
    
    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* 2. RESPONSIVE FIX: Menggunakan Dynamic Viewport Height (dvh) untuk elak isu keyboard bertindih */
      html,
      body {
        height: 100vh !important;
        height: 100dvh !important; /* !important memaksa browser ikut saiz keyboard iPhone */
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Menghalang skrin utama daripada digoyang terkeluar bucu */
        -webkit-text-size-adjust: 100%; /* Menghalang iPhone daripada auto-besarkan teks */
      }
      #root {
        display: flex;
        height: 100vh !important;
        height: 100dvh !important;
        width: 100%;
      }

      /* 3. FIX BOX BIRU: Buang semua border biru menyala semasa kotak input ditekan */
      input, select, textarea, button, [component="TextInput"] {
        outline: none !important;
        box-shadow: none !important;
      }

      /* 4. CSS ORDER TRICK: Paksa susunan secara visual menggunakan CSS Flexbox */
      .susun-1 { order: 1 !important; }
      .susun-2 { order: 2 !important; }
      .susun-3 { order: 3 !important; }
      .susun-4 { order: 4 !important; }
      .susun-5 { order: 5 !important; }
    </style>
    
    <link rel="icon" href="./favicon.ico" />
    
    <!-- FIX MUTLAK SAFARI: Guna jalan relatif lokal + pancingan cache ?v=1 -->
    <link rel="apple-touch-icon" href="./assets/logo.2a8899cba02a3e3a00d566457322ffcf.png?v=1" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    
    <div id="root"></div>
    
    <script src="./_expo/static/js/web/index-eb102d7eff63d8361917b2b4ba1e0d13.js?v=4" defer></script>

    <!-- 5. SCRIPT PENJINAK VERSI AGRESIF: Tanam class order pada butang induk -->
    <script>
      (function() {
        const urutanSaranan = {
          "PERTANIAN": "susun-1",
          "PEMBUATAN": "susun-2",
          "PEMBINAAN": "susun-3",
          "PERKHIDMATAN": "susun-4",
          "INDUSTRI LAIN": "susun-5"
        };

        function paksaSusunCSS() {
          // Guna querySelectorAll untuk cari semua tag elemen teks
          const semuaTeks = document.querySelectorAll('div, span, p');
          
          semuaTeks.forEach(el => {
            if (el.textContent) {
              const teksBersih = el.textContent.trim().toUpperCase();
              
              // Jika terjumpa salah satu nama kategori
              if (urutanSaranan[teksBersih]) {
                const namaClassOrder = urutanSaranan[teksBersih];
                
                // Cari blok petak butang utama (biasanya ada style cursor pointer atau naik 3-4 tingkat ke atas)
                let petakButang = el;
                for (let i = 0; i < 4; i++) {
                  if (petakButang && petakButang.parentElement) {
                    // Semak jika parent dia mengandungi butang-butang lain (iaitu kontena menu)
                    if (petakButang.parentElement.children.length >= 3) {
                      break;
                    }
                    petakButang = petakButang.parentElement;
                  }
                }
                
                // Tambah class order pada petak butang dan pastikan kontena induk guna display flex
                if (petakButang) {
                  petakButang.classList.add(namaClassOrder);
                  if (petakButang.parentElement) {
                    petakButang.parentElement.style.display = 'flex';
                  }
                }
              }
            }
          });
        }

        // Jalankan imbasan pantas setiap 200ms sebaik sahaja skrin dipaparkan
        const monitorSistem = setInterval(paksaSusunCSS, 200);
        
        // Matikan interval selepas 7 saat untuk elakkan lagging
        setTimeout(() => clearInterval(monitorSistem), 7000);
      })();
    </script>
  </body>
</html>
